name: Test Atlas

on:
  pull_request:
    branches:
      - main
      - release
      - release/*

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test

  # The native translator with no driver-LINQ fallback (MongoQueryMode.NativeOnly) must pass every suite too.
  # See MongoSpecTestHelpers.IsNativeOnly for tests whose expectation depends on the mode.
  native-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ["Debug EF10", "Debug EF11"]
    env:
      MONGODB_EF_QUERY_MODE: NativeOnly
      BUILD_CONFIGURATION: ${{ matrix.configuration }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # EF11 builds for net11.0.
      - name: Setup .NET 11
        if: matrix.configuration == 'Debug EF11'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Build
        run: dotnet build MongoDB.EFCoreProvider.sln -c "$BUILD_CONFIGURATION"

      - name: Unit tests
        run: dotnet test tests/MongoDB.EntityFrameworkCore.UnitTests -c "$BUILD_CONFIGURATION" --no-build

      - name: Functional tests
        run: dotnet test tests/MongoDB.EntityFrameworkCore.FunctionalTests -c "$BUILD_CONFIGURATION" --no-build

      - name: Specification tests
        if: matrix.configuration != 'Debug EF11'
        run: dotnet test tests/MongoDB.EntityFrameworkCore.SpecificationTests -c "$BUILD_CONFIGURATION" --no-build

      # EF11's SpecificationTests (xUnit v3 4.x) do not run under `dotnet test`; run the built test host directly.
      - name: Specification tests (EF11)
        if: matrix.configuration == 'Debug EF11'
        run: dotnet "tests/MongoDB.EntityFrameworkCore.SpecificationTests/bin/Debug EF11/net11.0/MongoDB.EntityFrameworkCore.SpecificationTests.dll" -noColor
